services:
  icecream-backend:
    container_name: icecream_backend
    image: icecream-backend:latest
    environment:
      #DB
      DB_USER: ${DB_USER:?error}
      DB_PASSWORD: ${DB_PASSWORD:?error}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:?error}
      DB_NAME: ${DB_NAME:?error}
      #AUTH
      SALT_ROUNDS: ${SALT_ROUNDS:?error}
      #S3
      S3_HOST: ${S3_HOST:?error}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?error}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?error}
      S3_USE_SSL: ${S3_USE_SSL:?error}
      NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL:?error}
      #YOOKASSA
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:?error}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?error}
      #NEXT
      NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN:?error}
      #BACKEND
      SHOW_API_DOCS: ${SHOW_API_DOCS:?error}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - devnet
  icecream-frontend:
    container_name: icecream_frontend
    image: icecream-frontend:latest
    environment:
      #AUTH
      AUTH_VK_ID: ${AUTH_VK_ID:?error}
      AUTH_VK_SECRET: ${AUTH_VK_SECRET:?error}
      AUTH_VK_SERVICE: ${AUTH_VK_SERVICE:?error}
      AUTH_YANDEX_ID: ${AUTH_YANDEX_ID:?error}
      AUTH_YANDEX_SECRET: ${AUTH_YANDEX_SECRET:?error}
      #SMTP
      SMTP_HOST: ${SMTP_HOST:?error}
      SMTP_PORT: ${SMTP_PORT:?error}
      SMTP_SECURE: ${SMTP_SECURE:?error}
      SMTP_USER: ${SMTP_USER:?error}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?error}
      #S3
      NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL:?error}
      #FRONTEND
      NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN:?error}
      #YOOKASSA
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:?error}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?error}
      #BACKEND
      API_URL: ${API_URL:?error}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - devnet
    depends_on:
      - icecream-backend
    # volumes:
    #   - ./apps/frontend/public:./app/public
    ports:
      - "3000:3000"
  migration_tool:
    container_name: icecream_migration_tool
    image: icecream-migration-tool:latest
    environment:
      DB_USER: ${DB_USER:?error}
      DB_PASSWORD: ${DB_PASSWORD:?error}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:?error}
      DB_NAME: ${DB_NAME:?error}
    env_file:
      - .env
    networks:
      - devnet

networks:
  devnet:
    external: true
